services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kapitmas
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kapitmas_iot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapitmas -d kapitmas_iot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://kapitmas:password@postgres:5432/kapitmas_iot
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      APP_ENV: development
      APP_DEBUG: "true"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      # Ganti dengan IP LAN mesin yang menyajikan firmware OTA ke perangkat
      TIMBANGAN_OTA_BASE_URL: "http://host.docker.internal:8000"
      TZ: Asia/Makassar
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
